<!doctype html>
<html>
  <head>
    <title>Register</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #dce8f3;
        font-family: system-ui, sans-serif;
        color: #111;
      }

      .card {
        width: min(420px, 100%);
        background: #fff;
        padding: 32px;
        border-radius: 18px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        margin-bottom: 24px;
        font-size: 1.9rem;
        text-align: center;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      .help-text {
        color: #475569;
        font-size: 0.95rem;
      }

      .error {
        color: #b91c1c;
        background: #fbe4e6;
        padding: 12px 14px;
        border-radius: 10px;
      }

      .footer {
        margin-top: 18px;
        text-align: center;
        color: #475569;
      }

      .footer a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Create account</h1>
      <form method="post">
        {% csrf_token %} {% if form.non_field_errors %}
        <div class="error">{{ form.non_field_errors|join:' ' }}</div>
        {% endif %}
        <label>
          Username
          <input
            type="text"
            name="username"
            value="{{ form.username.value|default_if_none:'' }}"
            required
            autofocus
          />
          {% if form.username.errors %}
          <div class="error">{{ form.username.errors|join:' ' }}</div>
          {% endif %}
        </label>
        <label>
          Password
          <input type="password" name="password1" required />
          {% if form.password1.errors %}
          <div class="error">{{ form.password1.errors|join:' ' }}</div>
          {% endif %}
        </label>
        <label>
          Confirm password
          <input type="password" name="password2" required />
          {% if form.password2.errors %}
          <div class="error">{{ form.password2.errors|join:' ' }}</div>
          {% endif %}
        </label>
        <button type="submit">Register</button>
      </form>
      <p class="footer">
        Already have an account? <a href="{% url 'login' %}">Log in</a>
      </p>
    </main>
  </body>
</html>
