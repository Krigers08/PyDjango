<!doctype html>
<html>
  <head>
    <title>My To-Do List</title>
  </head>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100vh;
      height: 100%;
    }

    body {
      background: #dce8f3;
      color: #111;
      font-family: system-ui, sans-serif;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    .content {
      width: min(720px, 100%);
      background: #fff;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 1.9rem;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    form input {
      flex: 1 1 220px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      font: inherit;
    }

    form button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .toggle-button,
    .delete-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #f8f9fa;
      color: #111;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-button:hover,
    .delete-button:hover {
      background: #e9ecef;
    }

    .toggle-button.done {
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
    }

    .toggle-button.not-done {
      background: #dce8f8;
      border-color: #4a90d9;
      color: #1a4f7a;
    }

    .delete-button:hover {
      background: #ffe7e7;
    }
  </style>
  <body>
    <div class="app-shell">
      <main class="content">
        <h1>To-Do List</h1>

        <p style="margin: 0 0 20px; text-align:center; color:#334155;">
          Logged in as <strong>{{ request.user.username }}</strong>
          • <a href="{% url 'logout' %}?next={% url 'todo-list' %}">Logout</a>
        </p>

        <!-- CREATE form -->
        <form method="POST" action="{% url 'todo-create' %}">
          {% csrf_token %}
          {{ form.title }}
          <button type="submit">Add</button>
        </form>

        <!-- READ list -->
    <ul>
      {% for todo in todos %}
      <li>
        {{ todo.title }}
        <!-- UPDATE -->

        <a class="toggle-button {% if todo.done %}done{% else %}not-done{% endif %}" href="{% url 'todo-toggle' todo.pk %}">
            {% if todo.done %}Done{% else %}Not Done{% endif %}
        </a>

        <!-- DELETE -->
        <a class="delete-button" href="{% url 'todo-delete' todo.pk %}"
          >Delete</a
        >
      </li>
      {% empty %}
      <li>No todos yet!</li>
      {% endfor %}
    </ul>
  </body>
</html>
